baseURL: "https://lzh0394.github.io/"

defaultContentLanguage: "zh-cn"

locale: "zh-cn"

title: "lzh0394"

ignoreFiles: ["\\.Rmd$", "\\.Rmarkdown$", "_cache$"]

footnotereturnlinkcontents: "↩"

disableKinds: ["RSS"]

taxonomies:
  tag: tags
  series: series

menu:
  main:
    - name: 首页
      url: ""
      weight: 1
    - name: 关于
      url: "about/"
      weight: 2
    - name: 系列
      url: "series/"
      weight: 3
    - name: 标签
      url: "tags/"
      weight: 4

permalinks:
  post: "/post/:year/:month/:day/:slug/"

params:
  description: "极简"
  footer: "Be happy."

markup:
  highlight:
    codeFences: false
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - - \[
              - \]
            - - $$
              - $$
          inline:
            - - \(
              - \)
