name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages 部署需要的三项权限。
# id-token 用于 OIDC，让 deploy-pages 不必长期持有凭证。
permissions:
  contents: read
  pages: write
  id-token: write

# Pages 部署同时只允许一个。
# 这里刻意不写 cancel-in-progress: true —— 部署跑到一半被取消，
# 可能让线上的 Pages 处于半更新状态；宁可排队等前一次跑完。
concurrency:
  group: pages
  cancel-in-progress: false

# 钉住具体镜像而不是 ubuntu-latest：latest 会在 LTS 之间渐进迁移，
# 用标签既会收到迁移 notice，构建环境也可能悄悄变化。
# 26.04 是当前 LTS（2026-04 发布，镜像已 GA）；换版本时显式改这里。
#
# 构建与部署合并在同一个作业里：拆成两个作业会多出约 4 秒的作业切换
# 与一次重复的 setup，而 deploy-pages 只要求产物来自同一次运行，
# 权限本来就是全局声明，合并不会放宽任何权限。
jobs:
  build-deploy:
    runs-on: ubuntu-26.04
    name: 构建并发布
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 安装 Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # 必须 >= 0.146.0：xmin 用的是新版 layouts/_partials/ 目录结构
          # 与本地 .tools/hugo 里的版本保持一致（0.169.0），避免"本地能构建、CI 不能"
          hugo-version: '0.169.0'

      - name: 配置 Pages
        id: pages
        uses: actions/configure-pages@v6

      # 构建命令用 actions 提供的 base_url，而不是写死 hugo.yaml 里的 baseURL。
      # 这样仓库改名、换域名或改用项目仓库时，CI 会自动跟着变。
      - name: 构建站点
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
        env:
          HUGO_ENVIRONMENT: production

      - name: 上传产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v5
